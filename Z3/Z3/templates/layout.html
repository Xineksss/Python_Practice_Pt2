<!doctype html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %} {% endblock title %}</title>
    <link rel="stylesheet" href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href = "{% static 'main/css/main.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css">
</head>
<body>
    <aside>
        <img src="{% static '/main/img/test_logo.png' %}" alt="logo">
        <span class="logo">Наше название</span>
      <h3>Навигация</h3>
      <ul>
        <a href = "{% url 'customers' %}"><li><i class="fa-solid fa-people-group"></i> Клиенты</li></a>
        <a href = "{% url 'products' %}"><li><i class="fa-solid fa-cart-shopping"></i> Товары</li></a>
        <a href = "{% url 'sale' %}"><li><i class="fa-solid fa-credit-card"></i> Продажа</li></a>
        <a href = "{% url 'sale_progress' %}"><li><i class="fa-solid fa-clock-rotate-left"></i> Ход продаж</li></a>
      </ul>
    </aside>
    <main>
      {% block content %}
      {% endblock content %}
    </main>
</body>
</html>
