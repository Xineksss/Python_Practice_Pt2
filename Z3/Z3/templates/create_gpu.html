{% extends 'layout.html' %}

{% block title %}Добавить товар{% endblock %}

{% block content %}
<h2>Добавить новый товар</h2>

<form method="POST" style="max-width: 600px;">
    {% csrf_token %}

        <label class = "form-label">Название видеокарты:</label><br>
        <input type="text" name="name" required><br><br>


        <label class="form-label">Цена (₽):</label><br>
        <input type="number" step="1000" name="price" required><br><br>

        <label class="form-label">Тип видеопамяти:</label><br>
        <input type="text" name="memory_type" required><br><br>

        <label class="form-label">Частота (Mhz):</label><br>
        <input type="number" name="frequency" required><br><br>

        <label class="form-label">Количество видеопамяти (GB):</label><br>
        <input type="number" name="memory_size" required><br><br>

    <button type="submit" class="btn btn-success">Добавить</button>
    <a href="{% url 'products' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
