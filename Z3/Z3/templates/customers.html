{% extends 'layout.html' %}

{% block title %}Клиенты{% endblock %}

{% block content %}
<form method="POST" action="{% url 'create_client' %}">
    {% csrf_token %}
    <h2>Клиенты</h2>
    <p>
        <label>Ввести клиента:</label><br>
        <input type="text" name = "client"/>
    </p>
    <input type="submit" value = "Сохранить">
</form>

<table>
    <thead>
    <th>Id</th><th>Клиент</th>
    </thead>
    {% for client in clients   %}
    <tr>
        <td>{{client.id}}</td>
        <td>{{client.name}}</td>
        <td>
            <a href="{% url 'edit_client' client.id %}" class="btn btn-primary btn-sm me-2">Изменить</a>
            <a href="{% url 'delete_client' client.id %}" class="btn btn-danger btn-sm">Удалить</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>

{% endblock %}
