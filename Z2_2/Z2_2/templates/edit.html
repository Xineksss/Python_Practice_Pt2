<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
</head>
<body>
    <h2>Изменение товара</h2>
    <form method="POST">
        {% csrf_token %}
        <p>
            <label>Введите название товара</label><br>
            <input type="text" name="name" value="{{model.name}}" />
        </p>
        <p>
            <label>Введите цену</label><br>
            <input type="number" name="price" value="{{model.price}}"/>
        </p>
        <p>
            <label>Введите компанию</label><br>
            <select name="brand">
            {% for brand in brands %}
                <option value="{{brand.id}}"
                {%if brand.id == model.brand_id%}
                  selected
                {%endif%}
            >{{brand.name}}</option>
            {% endfor %}
            </select>
        </p>
        <input type="submit" value="Сохранить" >
    </form>
</body>
</html>
