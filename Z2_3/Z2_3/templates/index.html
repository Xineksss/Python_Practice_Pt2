<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
    <h2>Список покупателей</h2>
    <a href="create/">Добавление покупателя</a>
    <table>
        <thead><th>Имя</th><th>Покупки</th></thead>
        {% for customer in customers %}
        <tr>
            <td>{{ customer.name }}</td>
            <td>
                {% for gpu in customer.courses.all %}
                    {{gpu.name}}
                {% endfor %}
            </td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
