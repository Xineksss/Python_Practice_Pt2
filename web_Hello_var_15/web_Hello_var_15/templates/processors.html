<!doctype html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Процессоры</title>
</head>
<body>
<h1>Каталог процессоров</h1>
<img src="{% static 'img/processor.png' %}" width="450">

<table>
        <thead>
            <tr>
                {% for header in headers %}
                <th>{{ header }}</th>
                {% endfor %}
            </tr>
        </thead>

        <tbody>
            {% for row in data %}
            <tr>
                {% for value in row.values %}
                    <td>{{ value }}</td>
                {% endfor %}

            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/navigator">Вернуться в навигатор</a>


</body>
</html>
